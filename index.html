<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级语音播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 顶部保密横幅 */
        .top-banner {
            background-color: #dc3545;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 16px;
            position: sticky;
            top: 0;
            z-index: 999;
            width: 100%;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 0; /* 取消原有顶部内边距，避免重复留白 */
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
            margin-top: 20px; /* 与横幅保持间距 */
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .hint {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .player-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .current-playing {
            color: #333;
            margin-bottom: 15px;
            font-size: 14px;
            word-break: break-all;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .control-btn:hover {
            background: #5568d3;
        }
        
        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .progress-container {
            margin-bottom: 15px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* 倍速控制样式 */
        .speed-control {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .speed-label {
            color: #555;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        
        .speed-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .speed-btn {
            padding: 8px 16px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .speed-btn:hover {
            background: #f0f0f0;
        }
        
        .speed-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .playlist-section {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .playlist-header h3 {
            color: #333;
            font-size: 18px;
        }
        
        .clear-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .clear-btn:hover {
            background: #c82333;
        }
        
        .playlist {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .playlist-item {
            padding: 12px;
            background: white;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .playlist-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .playlist-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .playlist-item-content {
            flex: 1;
            margin-right: 10px;
        }
        
        .playlist-item-index {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .playlist-item-url {
            font-size: 12px;
            opacity: 0.8;
            word-break: break-all;
        }
        
        .delete-btn {
            padding: 4px 8px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .playlist-item.active .delete-btn {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .empty-playlist {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部保密横幅 -->
    <div class="top-banner">请严格遵守保密原则，业务信息禁止外传</div>

    <div class="container">
        <h1>🎵 语音播放器</h1>
        
        <!-- 输入区域 -->
        <div class="input-section">
            <label>批量添加语音链接</label>
            <textarea id="urlInput" placeholder="请输入语音链接，每行一个&#10;例如：&#10;https://example.com/audio1.mp3&#10;https://example.com/audio2.mp3"></textarea>
            <div class="hint">💡 提示：每行输入一个链接，支持 mp3、wav、ogg 等格式</div>
            <button class="btn" onclick="addUrls()" style="margin-top: 15px;">添加到播放列表</button>
        </div>
        
        <!-- 播放器区域 -->
        <div class="player-section">
            <div class="current-playing" id="currentPlaying">当前未播放</div>
            
            <!-- 倍速控制 -->
            <div class="speed-control">
                <span class="speed-label">播放速度</span>
                <div class="speed-buttons">
                    <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                    <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
                    <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="speed-btn" onclick="setSpeed(2)">2x</button>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" onclick="previousTrack()">⏮ 上一首</button>
                <button class="control-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
                <button class="control-btn" onclick="nextTrack()">⏭ 下一首</button>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>
        
        <!-- 播放列表 -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h3>📃 播放列表 (<span id="playlistCount">0</span>)</h3>
                <button class="clear-btn" onclick="clearPlaylist()">清空列表</button>
            </div>
            <div class="playlist" id="playlist">
                <div class="empty-playlist">播放列表为空<br>请在上方添加语音链接</div>
            </div>
        </div>
        
        <audio id="audioPlayer">
    </div>
    <script>
        let playlist = [];
        let currentIndex = -1;
        let currentSpeed = 1; // 当前播放速度
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        // 添加URL到播放列表
        function addUrls() {
            const input = document.getElementById('urlInput');
            const urls = input.value.split('\n').filter(url => url.trim());
            
            if (urls.length === 0) {
                alert('请输入至少一个链接！');
                return;
            }
            
            urls.forEach(url => {
                url = url.trim();
                if (url && !playlist.includes(url)) {
                    playlist.push(url);
                }
            });
            
            updatePlaylist();
            input.value = '';
            alert(`成功添加 ${urls.length} 个链接到播放列表！`);
        }
        
        // 更新播放列表显示
        function updatePlaylist() {
            const playlistEl = document.getElementById('playlist');
            const countEl = document.getElementById('playlistCount');
            
            countEl.textContent = playlist.length;
            
            if (playlist.length === 0) {
                playlistEl.innerHTML = '<div class="empty-playlist">播放列表为空<br>请在上方添加语音链接</div>';
                return;
            }
            
            playlistEl.innerHTML = playlist.map((url, index) => `
                <div class="playlist-item ${index === currentIndex ? 'active' : ''}" onclick="playTrack(${index})">
                    <div class="playlist-item-content">
                        <span class="playlist-item-index">${index + 1}.</span>
                        <span class="playlist-item-url">${url}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTrack(event, ${index})">删除</button>
                </div>
            `).join('');
        }
        
        // 播放指定曲目
        function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            
            currentIndex = index;
            audio.src = playlist[index];
            audio.playbackRate = currentSpeed; // 设置播放速度
            audio.play();
            playBtn.textContent = '⏸ 暂停';
            
            document.getElementById('currentPlaying').textContent = `正在播放：${playlist[index]}`;
            updatePlaylist();
        }
        
        // 切换播放/暂停
        function togglePlay() {
            if (playlist.length === 0) {
                alert('播放列表为空！请先添加语音链接。');
                return;
            }
            
            if (audio.paused) {
                if (currentIndex === -1) {
                    playTrack(0);
                } else {
                    audio.play();
                    playBtn.textContent = '⏸ 暂停';
                }
            } else {
                audio.pause();
                playBtn.textContent = '▶ 播放';
            }
        }
        
        // 上一首
        function previousTrack() {
            if (playlist.length === 0) return;
            const newIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
            playTrack(newIndex);
        }
        
        // 下一首
        function nextTrack() {
            if (playlist.length === 0) return;
            const newIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1;
            playTrack(newIndex);
        }
        
        // 设置播放速度
        function setSpeed(speed) {
            currentSpeed = speed;
            audio.playbackRate = speed;
            
            // 更新按钮状态
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        // 删除曲目
        function deleteTrack(event, index) {
            event.stopPropagation();
            
            if (confirm('确定要删除这首歌吗？')) {
                const wasPlaying = index === currentIndex && !audio.paused;
                
                playlist.splice(index, 1);
                
                if (index < currentIndex) {
                    currentIndex--;
                } else if (index === currentIndex) {
                    audio.pause();
                    currentIndex = -1;
                    playBtn.textContent = '▶ 播放';
                    document.getElementById('currentPlaying').textContent = '当前未播放';
                }
                
                updatePlaylist();
            }
        }
        
        // 清空播放列表
        function clearPlaylist() {
            if (playlist.length === 0) return;
            
            if (confirm('确定要清空整个播放列表吗？')) {
                playlist = [];
                currentIndex = -1;
                audio.pause();
                audio.src = '';
                playBtn.textContent = '▶ 播放';
                document.getElementById('currentPlaying').textContent = '当前未播放';
                updatePlaylist();
            }
        }
        
        // 拖动进度条
        function seekAudio(event) {
            if (!audio.src) return;
            
            const progressBar = document.getElementById('progressBar');
            const rect = progressBar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
        
        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 音频事件监听
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });
        
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });
        
        audio.addEventListener('ended', () => {
            nextTrack();
        });
        
        audio.addEventListener('error', () => {
            alert('播放失败！请检查链接是否正确。');
            playBtn.textContent = '▶ 播放';
        });
    </script>
</body>
</html>
